name: Deploy Airflow to EC2

on:
  pull_request:
    branches:
      - main
    types: [closed]

  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔐 Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Verificar Status da EC2
        id: check-status
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "Status atual da instância: $STATE"
          echo "INSTANCE_STATE=$STATE" >> $GITHUB_ENV

      - name: 🚀 Ligar Instância (Apenas se estiver desligada)
        if: env.INSTANCE_STATE != 'running'
        run: |
          aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
          echo "Aguardando a instância inicializar..."
          aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID }}

      - name: 🔎 Obter IP Público Dinâmico
        id: get-ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "IP capturado: $PUBLIC_IP"
          echo "EC2_PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: ⏳ Aguardar boot do SSH
        if: env.INSTANCE_STATE != 'running'
        run: sleep 30

      - name: ⚙️ Executar Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_PUBLIC_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            PROJECT_DIR="/home/${{ secrets.SSH_USER }}/market_data_lakehouse"
            USER_ID=$(id -u)

            echo "=== Iniciando deploy do Airflow ==="

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Clonando repositório pela primeira vez..."
              sudo rm -rf $PROJECT_DIR
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $PROJECT_DIR
            fi

            cd $PROJECT_DIR
            echo "Atualizando código da branch main..."
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Remove cached Python files to avoid permission issues
            find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            find . -type f -name "*.pyc" -delete 2>/dev/null || true

            cat > .env << EOF
            AIRFLOW_UID=${USER_ID}
            AIRFLOW_GID=0
            AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            AWS_REGION=${AWS_REGION}
            EOF

            echo "AIRFLOW_UID configurado como ${USER_ID}"

            mkdir -p ./dags ./logs ./plugins ./config
            sudo chown -R ${USER_ID}:0 $PROJECT_DIR 2>/dev/null || true
            sudo chmod -R g+rwx $PROJECT_DIR 2>/dev/null || true
            chmod -R 777 logs 2>/dev/null || true

            docker image prune -f

            echo "Parando containers antigos..."
            docker compose down --remove-orphans

            echo "Executando airflow-init (pode demorar 30-90s)..."
            docker compose up airflow-init

            # Wait for airflow-init to complete and verify success
            AIRFLOW_INIT_SUCCESS=false
            for i in {1..5}; do
              if docker compose logs airflow-init | grep -q "Airflow database initialized"; then
                AIRFLOW_INIT_SUCCESS=true
                break
              fi
              sleep 5
            done

            if [ "$AIRFLOW_INIT_SUCCESS" = false ]; then
              docker compose logs airflow-init | tail -100
              echo "WARNING: Could not verify airflow-init success, but continuing..."
            fi

            echo "Subindo os demais serviços..."
            docker compose up -d

            echo "=== Deploy finalizado! Verificando status ==="
            docker compose ps

            # Verify critical services are running
            SERVICES_RUNNING=true
            REQUIRED_SERVICES=("airflow-webserver" "airflow-scheduler" "airflow-worker" "postgres" "redis")

            for service in "${REQUIRED_SERVICES[@]}"; do
              if ! docker compose ps | grep -q "$service.*Up"; then
                echo "ERROR: Service $service is not running!"
                SERVICES_RUNNING=false
              fi
            done

            if [ "$SERVICES_RUNNING" = false ]; then
              echo "ERROR: Some critical services failed to start!"
              docker compose logs --tail=100
              exit 1
            fi

            echo "=== Deploy completed successfully! ==="
            docker compose logs --tail=50 airflow-webserver

      - name: 🛑 Desligar Instância (Apenas se a esteira ligou a máquina)
        if: always() && env.INSTANCE_STATE != 'running'
        run: |
          aws ec2 stop-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
          echo "A máquina foi desligada automaticamente."
