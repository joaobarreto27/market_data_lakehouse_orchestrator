[project]
name = "market-data-lakehouse-orchestrator"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.13"

authors = [
  { name = "joaobarreto27", email = "joao.vito1951@gmail.com" }
]

dependencies = [
  "requests>=2.32.5,<3.0.0",
  "pyspark (==3.5.4)",
  "pydantic>=2.12.5,<3.0.0",
  "pandera>=0.28.1,<0.29.0",
  "pandas>=2.3.3,<3.0.0",
  "python-dotenv>=1.2.1,<2.0.0",
  "pyarrow (>=23.0.0,<24.0.0)",
  "setuptools (>=82.0.1,<83.0.0)",
  "tornado (>=6.5.5,<7.0.0)",
  "boto3 (>=1.42.73,<2.0.0)",
  "pygments (>=2.19.2,<3.0.0)",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.14.13,<0.15.0",
  "mypy>=1.19.1,<2.0.0",
  "taskipy>=1.14.1,<2.0.0",
  "pre-commit>=4.5.1,<5.0.0",
  "pip-audit>=2.10.0,<3.0.0",
  "bandit>=1.9.2,<2.0.0",
  "types-requests>=2.32.4.20260107,<3.0.0.0",
  "pandas-stubs>=2.3.3.260113,<3.0.0.0",
]

[tool.setuptools]
package-dir = { "" = "dags/etl/src" }

[tool.setuptools.packages.find]
where = ["dags/etl/src"]
include = ["worker*", "infrastructure*"]

[tool.ruff]
line-length = 88
exclude = ["dags/__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["dags/etl/src"]
mypy_path = ["dags/etl/src"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.taskipy.tasks]
format = "ruff format ."
fix = "ruff check . --fix"
commit = "pre-commit run --all-files"
typecheck = "mypy dags/etl/src"
security = "bandit -r dags/etl/src -s B101"
audit = "pip-audit"
ci = """
task format
task fix
task typecheck
task security
task audit
task commit
"""

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
